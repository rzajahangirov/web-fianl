<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            display: flex;
            flex-direction: row;
            gap: 70px;
            width: 500px;
            height: 100px;
            background-color: rgb(190, 189, 189);
            padding: 10px 30px;
            margin: 70px auto;
        }
        .child{
            display: flex;
            flex: 1;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
        .a{
            background-color: red;
            color: white;
        }
        .b{
            background-color: blue;
            color: white;
        }
        .c{
            background-color: green;
            color: white;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child a">1</div>
        <div class="child b">2</div>
        <div class="child c">3</div>
    </div>
</body>
</html>
