<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 200px;
            width: 200px;
            margin: 200px auto;
        }
        .child{
            flex: 1;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .a{background-color: rgb(64, 0, 128);}
        .b{background-color: rgb(152, 82, 221);}
        .c{background-color: rgb(106, 0, 211);}
    </style>
</head>
<body>
    <div class="parent">
        <div class="child a">Item One</div>
        <div class="child b">Item Two</div>
        <div class="child c">Item Theree</div>
    </div>
</body>
</html>
