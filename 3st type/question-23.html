<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 200px;
            width: 200px;
            margin: auto auto;
        }
        .child{
            display: flex;
            flex: 1;
            justify-content: left;
            align-items: center;
            color: white;
            text-indent: 10px;
        }
        .a{
            background-color: rgb(45, 110, 45);
        }
        .b{
            background-color: rgb(30, 87, 30);
        }
        .c{
            background-color: rgb(0, 57, 0);
        }
        .d{
            background-color: rgb(63, 83, 0);
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child a">Task 1</div>
        <div class="child b">Task 2</div>
        <div class="child c">Task 3</div>
        <div class="child d">Task 4</div>
    </div>
</body>
</html>
