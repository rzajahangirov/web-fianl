<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            display: grid;
            grid-column: 1fr 1fr;
            gap: 10px;
            height: 100px;
            width: 300px;
            margin: auto auto;
        }
        .child{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: red;
            color: white;
        }
        .header{
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child header">Header</div>
        <div class="child">Box 3</div>
        <div class="child"> Box 4</div>
    </div>
</body>
</html>
