<!DOCTYPE html>
<html lang="en">
<head>
    <title>15</title>
    <style>
        .parent{
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap:5px;
            width:200px;
            height: 200px;
            color: white;
            margin: auto auto;
        }
        .box{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: xx-large;
            font-weight: bold;
        }
        .box1{background-color: green;}
        .box2{background-color: greenyellow;}
        .num1{ grid-row: span 2 ;}
        .num4{grid-column: span 2;}
    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1 num1">1</div>
        <div class="box box2">2</div>
        <div class="box box2">3</div>
        <div class="box box1 num4">4</div>
    </div>
</body>
</html>
