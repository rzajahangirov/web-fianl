<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border-left: 10px solid green;
            padding-left: 20px;
            width: 500px; 
        }

        h1{
            font-family: Arial;
            font-weight: bold;
            text-decoration: underline;
            color: green;
        }

         p{
            color: gray;
        }

        b{
            font-family: Arial, Helvetica, sans-serif;
            color: green;
        }
    </style>
</head>
<body>
    <div>
        <h1>Environmental Awareness</h1>
        <p>protecting our planet requires <b>collective action</b> 
            and commitment from individuals, communities, and governments worldwide.</p>
        <p>Sustainable practice and <b>renewable energy</b> are essential for future generations.</p> 
    </div>
</body>
</html>
