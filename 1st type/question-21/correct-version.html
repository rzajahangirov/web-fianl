<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border-left: 5px solid red;
            padding-left: 10px;
        }
        h1{
            font-weight: bold;
            color: red;
        }
        p{
            color: grey;

        b{

    <div>
        <h1><i>Software Engineering</i></h1>

    </div>

</html>
